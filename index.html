<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signatures Email — Deskeo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F2EE;
  --bg2: #FFFFFF;
  --bg3: #F4F2EE;
  --bg4: #EAE8E3;
  --border: #DDD9D2;
  --border2: #C8C4BB;
  --violet: #2B5BA8;
  --violet-lt: rgba(43,91,168,.10);
  --violet-md: #3D6FBF;
  --cyan: #0891B2;
  --cyan-lt: rgba(8,145,178,.1);
  --rose: #E11D48;
  --rose-lt: rgba(225,29,72,.1);
  --emerald: #059669;
  --emerald-lt: rgba(5,150,105,.1);
  --amber: #B45309;
  --amber-lt: rgba(180,83,9,.1);
  --text: #1C1814;
  --text2: #4A443E;
  --text3: #8C857D;
  --white: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── HEADER ── */
.hdr {
  height: 52px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.hdr-left { display: flex; align-items: center; gap: 12px; }
.hdr-logo { display: flex; align-items: center; gap: 8px; }
.logo-icon {
  width: 26px; height: 26px;
  background: linear-gradient(135deg, var(--violet), var(--cyan));
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff;
}
.logo-name { font-size: 14px; font-weight: 700; color: var(--text); }
.hdr-sep { width: 1px; height: 18px; background: var(--border2); }
.hdr-subtitle { font-size: 12px; color: var(--text3); font-weight: 500; }
.hdr-right { display: flex; gap: 8px; align-items: center; }

/* ── BTNS ── */
.btn {
  padding: 7px 16px; border-radius: 7px; border: none;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .15s; letter-spacing: .01em;
}
.btn-violet { background: var(--violet); color: #fff; }
.btn-violet:hover { background: var(--violet-md); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,92,252,.4); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { color: var(--text); border-color: var(--violet); }
.btn-copy { background: var(--bg4); color: var(--text2); border: 1px solid var(--border2); }
.btn-copy:hover { background: var(--emerald-lt); color: var(--emerald); border-color: var(--emerald); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); transition: all .15s; }
.btn-icon:hover { border-color: var(--violet); color: var(--violet); }
.btn-icon.active { background: var(--violet-lt); border-color: var(--violet); color: var(--violet); }

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-columns: 280px 380px 1fr;
  align-items: start;
  margin-top: 52px;
}

/* ── LEFT — TEMPLATES ── */
.col-templates {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 12px;
  position: sticky;
  top: 52px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
}
.col-title {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .1em;
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* TEMPLATE CARDS */
.tpl-card {
  border: 1.5px solid var(--border);
  border-radius: 10px; overflow: hidden;
  cursor: pointer; transition: all .2s; margin-bottom: 10px;
  background: var(--bg3);
}
.tpl-card:hover { border-color: var(--violet); transform: translateY(-1px); }
.tpl-card.active { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-lt); }
.tpl-preview { padding: 10px; background: #fff; min-height: 80px; overflow: hidden; }
.tpl-preview-inner { transform: scale(0.42); transform-origin: top left; width: 238%; pointer-events: none; }
.tpl-name {
  padding: 8px 12px; font-size: 11px; font-weight: 700; color: var(--text2);
  display: flex; align-items: center; justify-content: space-between;
}
.tpl-badge { padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; background: var(--violet-lt); color: var(--violet); }

/* ── CENTER — EDITOR ── */
.col-editor {
  background: var(--bg);
  padding: 24px;
  display: flex; flex-direction: column; gap: 16px;
}
.editor-section {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.es-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.es-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.es-dot { width: 6px; height: 6px; border-radius: 50%; }
.es-body { padding: 16px; }

/* FORM */
.fg { margin-bottom: 12px; }
.fg:last-child { margin-bottom: 0; }
.fg label { display: block; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
.fg input, .fg select, .fg textarea {
  width: 100%; padding: 8px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
  color: var(--text); background: var(--bg3);
  outline: none; transition: border-color .15s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--violet); background: var(--bg4); }
.fg select option { background: var(--bg3); }
.fg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fg-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* COLOR PICKER */
.color-row { display: flex; align-items: center; gap: 10px; }
.color-swatch {
  width: 36px; height: 36px; border-radius: 8px;
  border: 2px solid var(--border2); cursor: pointer;
  transition: border-color .15s; flex-shrink: 0;
  overflow: hidden;
}
.color-swatch:hover { border-color: var(--violet); }
.color-swatch input[type=color] { width: 150%; height: 150%; border: none; padding: 0; cursor: pointer; transform: translate(-16%, -16%); }
.color-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.cp { width: 22px; height: 22px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
.cp:hover, .cp.active { border-color: var(--white); transform: scale(1.15); }

/* TOGGLE */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.toggle-label { font-size: 13px; color: var(--text2); }
.toggle { position: relative; width: 36px; height: 20px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border2); border-radius: 10px; cursor: pointer; transition: .2s; }
.toggle-slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: var(--text3); border-radius: 50%; transition: .2s; }
.toggle input:checked + .toggle-slider { background: var(--violet); }
.toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: #fff; }

/* SOCIAL ICONS */
.social-row { display: flex; gap: 8px; margin-top: 8px; }
.social-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 20px;
  border: 1px solid var(--border2); background: var(--bg3);
  font-size: 11px; font-weight: 600; color: var(--text3);
  cursor: pointer; transition: all .15s;
}
.social-chip.on { border-color: var(--violet); color: var(--violet); background: var(--violet-lt); }
.social-chip:hover { border-color: var(--violet); color: var(--violet); }

/* ── RIGHT — PREVIEW ── */
.col-preview {
  background: var(--bg2);
  border-left: 1px solid var(--border);
  position: sticky;
  top: 52px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.preview-tabs {
  display: flex; padding: 10px 16px; gap: 6px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.preview-tab {
  padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .15s; color: var(--text3); background: transparent;
  border: 1px solid transparent;
}
.preview-tab.active { background: var(--violet-lt); color: var(--violet); border-color: var(--violet); }
.preview-area {
  padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* EMAIL MOCK */
.email-mock {
  background: #fff; border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  overflow: hidden;
}
.em-topbar {
  background: #F6F6F6; padding: 10px 14px;
  border-bottom: 1px solid #E8E8E8;
  display: flex; gap: 6px;
}
.em-dot { width: 10px; height: 10px; border-radius: 50%; }
.em-header {
  padding: 12px 16px; border-bottom: 1px solid #EBEBEB;
  font-family: Arial, sans-serif;
}
.em-from { font-size: 12px; color: #666; }
.em-from b { color: #111; }
.em-subject { font-size: 14px; font-weight: 600; color: #111; margin-top: 2px; }
.em-body { padding: 16px; font-family: Arial, sans-serif; font-size: 13px; color: #333; line-height: 1.6; }
.em-divider { height: 1px; background: #EBEBEB; margin: 0 16px; }
.em-sig { padding: 14px 16px; }

/* CODE VIEW */
.code-view {
  background: var(--bg3); border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.code-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.code-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
.code-body { padding: 14px; max-height: 300px; overflow-y: auto; }
.code-body pre { font-family: 'Courier New', monospace; font-size: 10.5px; color: var(--text2); white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

/* INSTRUCTIONS */
.install-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
}
.install-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.install-step {
  display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start;
}
.install-num {
  width: 20px; height: 20px; border-radius: 50%; background: var(--violet); color: #fff;
  font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.install-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
.install-text b { color: var(--text); }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 999;
  background: var(--emerald); color: #fff;
  padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  transform: translateY(60px); opacity: 0; transition: all .25s;
  box-shadow: 0 4px 20px rgba(52,211,153,.4);
}
.toast.show { transform: translateY(0); opacity: 1; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-track { background: var(--bg3); }
</style>
</head>

<div class="toast" id="toast">✓ Copié dans le presse-papiers</div>

<!-- HEADER -->

<!-- APP -->
<div class="app">

      </div>

        <div id="social-inputs" style="margin-top:12px;display:flex;flex-direction:column;gap:10px;"></div>
      </div>
    </div>





    <!-- Mentions légales -->
    <div class="editor-section">
      <div class="es-header">
        <div class="es-title"><div class="es-dot" style="background:var(--amber)"></div>Mentions légales</div>

  </div>

  <!-- ═══ PREVIEW ═══ -->
  <div class="col-preview">

      <div class="preview-tab" id="tab-install" onclick="switchTab('install')">Installation</div>
    </div>
    <div class="preview-area" id="preview-area"></div>
  </div>

</div>

// ── SOCIAL ───────────────────────────────────────────────────────
function renderSocialToggles() {
  document.getElementById('social-toggles').innerHTML = Object.entries(socials).map(([k,s])=>`
    <div class="social-chip ${s.on?'on':''}" onclick="toggleSocial('${k}')">${s.label}</div>`).join('');
  document.getElementById('social-inputs').innerHTML = Object.entries(socials).filter(([,s])=>s.on).map(([k,s])=>`
    <div class="fg"><label>${s.label} — URL</label>
      <input type="text" value="${s.val}" oninput="socials['${k}'].val=this.value;render()" placeholder="Ex: linkedin.com/company/..." />
    </div>`).join('');
}
function toggleSocial(k) { socials[k].on = !socials[k].on; renderSocialToggles(); render(); }

// ── COLOR PRESETS RENDER ─────────────────────────────────────────
function renderPresets() {
  document.getElementById('presets-primary').innerHTML = PRIMARY_PRESETS.map(c=>`
    <div class="cp" style="background:${c}" onclick="document.getElementById('c-primary').value='${c}';render()" title="${c}"></div>`).join('');
  document.getElementById('presets-accent').innerHTML = ACCENT_PRESETS.map(c=>`
    <div class="cp" style="background:${c}" onclick="document.getElementById('c-accent').value='${c}';render()" title="${c}"></div>`).join('');
}

// ── TEMPLATES SIDEBAR ────────────────────────────────────────────
function renderTemplateSidebar() {
  const d = getData();
  document.getElementById('tpl-list').innerHTML = TEMPLATES.map((t,i)=>`
    <div class="tpl-card ${currentTpl===i?'active':''}" onclick="currentTpl=${i};renderTemplateSidebar();render()">
      <div class="tpl-preview"><div class="tpl-preview-inner">${TEMPLATES[i].build(d)}</div></div>
      <div class="tpl-name">${t.name} <span class="tpl-badge">${t.badge}</span></div>
    </div>`).join('');
}

// ── GET DATA ─────────────────────────────────────────────────────
function getData() {
  const optMentions = document.getElementById('opt-mentions').checked;

  // Socials object
  const socialsObj = {};
  Object.entries(socials).forEach(([k,s]) => { if (s.on && s.val) socialsObj[k] = s.val; });

  const bannerBg = '#0F1B35'; const bannerColor = '#C8A84B';
  const bannerText = ''; const bannerLink = 'https://deskeo.com';
  const bannerHTML = '';

  const mentionsHTML = optMentions ? `
<div style="font-family:Helvetica,Arial,sans-serif;font-size:10px;color:#999;margin-top:12px;line-height:1.5;max-width:520px;border-top:1px solid #333;padding-top:8px;">
  ${document.getElementById('f-mentions').value}
</div>` : '';

  return {
    prenom:   document.getElementById('f-prenom').value,
    nom:      document.getElementById('f-nom').value,
    poste:    document.getElementById('f-poste').value,
    company:  document.getElementById('f-company').value,
    email:    document.getElementById('f-email').value,
    tel:      document.getElementById('f-tel').value,
    mobile:   document.getElementById('f-mobile').value,
    website:  document.getElementById('f-website').value,
    adresse:  document.getElementById('f-adresse').value,
    socials:  socialsObj,
    bannerBg, bannerColor, bannerText, bannerLink,
    bannerHTML, mentionsHTML,
  };
}

function buildSig() { return TEMPLATES[currentTpl].build(getData()); }

// ── RENDER PREVIEW ───────────────────────────────────────────────

  const sig = buildSig();
  const area = document.getElementById('preview-area');

  if (currentTab === 'preview') {

        <div class="em-topbar">

          <div class="em-dot" style="background:#FEBC2E"></div>

        </div>
        <div class="em-header">
          <div class="em-from">De : <b>${document.getElementById('f-prenom').value} ${document.getElementById('f-nom').value}</b> &lt;${document.getElementById('f-email').value}&gt;</div>
          <div class="em-subject">Re: Visite de vos bureaux flex — Confirmation</div>
        </div>
        <div class="em-body">
          Bonjour,<br><br>
          Merci pour votre intérêt. Je vous confirme notre rendez-vous de demain à 10h00 pour la visite de nos espaces.<br><br>
          N'hésitez pas à me contacter si vous avez des questions.<br><br>
          Bien cordialement,
        </div>
        <div class="em-divider"></div>
        <div class="em-sig">${sig}</div>
      </div>`;
  } else if (currentTab === 'sig') {
    area.innerHTML = `
      <div style="background:#fff;border-radius:10px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.4);">
        ${sig}
      </div>`;
  } else if (currentTab === 'code') {
    const clean = sig.replace(/\n\s+/g,' ').replace(/\s+/g,' ').trim();
    area.innerHTML = `

          <div class="code-label">HTML de la signature</div>
          <button class="btn btn-copy btn-sm" onclick="copyHTML()">⎘ Copier</button>
        </div>
        <div class="code-body"><pre id="code-pre">${escHtml(clean)}</pre></div>
      </div>`;
  } else if (currentTab === 'install') {
    area.innerHTML = `
      <div class="install-card">
        <div class="install-title">Gmail</div>
        ${[
          ['Copier la signature', 'Cliquez sur <b>✦ Copier la signature</b> en haut à droite.'],
          ['Ouvrir les paramètres', 'Dans Gmail : <b>⚙ Paramètres → Voir tous les paramètres → Général</b>'],
          ['Section Signature', 'Faites défiler jusqu\'à <b>Signature</b>, cliquez sur <b>Créer</b>.'],
          ['Coller', 'Collez avec <b>Ctrl+V</b> (ou ⌘V). Cliquez sur <b>Enregistrer les modifications</b>.'],
        ].map(([t,c],i)=>`
          <div class="install-step">
            <div class="install-num">${i+1}</div>
            <div class="install-text"><b>${t}</b><br>${c}</div>
          </div>`).join('')}
      </div>
      <div class="install-card">
        <div class="install-title">Outlook</div>
        ${[
          ['Copier la signature', 'Cliquez sur <b>✦ Copier la signature</b> en haut.'],
          ['Paramètres Outlook', '<b>Fichier → Options → Courrier → Signatures</b>'],
          ['Nouveau', 'Cliquez sur <b>Nouveau</b>, nommez votre signature.'],
          ['Coller', 'Dans la zone d\'édition, faites <b>Ctrl+V</b> pour coller.'],
        ].map(([t,c],i)=>`
          <div class="install-step">
            <div class="install-num">${i+1}</div>
            <div class="install-text"><b>${t}</b><br>${c}</div>
          </div>`).join('')}
      </div>
      <div class="install-card">
        <div class="install-title">Apple Mail</div>
        ${[
          ['Copier', 'Cliquez sur <b>✦ Copier la signature</b>.'],
          ['Préférences', '<b>Mail → Préférences → Signatures</b>'],
          ['Ajouter', 'Cliquez sur <b>+</b>, décochez "Toujours faire correspondre ma couleur de police par défaut".'],
          ['Coller', 'Collez dans la zone de texte avec <b>⌘V</b>.'],
        ].map(([t,c],i)=>`
          <div class="install-step">
            <div class="install-num">${i+1}</div>
            <div class="install-text"><b>${t}</b><br>${c}</div>
          </div>`).join('')}
      </div>`;
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}



// ── COPY ─────────────────────────────────────────────────────────
async function copySig() {
  const sig = buildSig();
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': new Blob([sig], { type: 'text/html' }), 'text/plain': new Blob([sig], { type: 'text/plain' }) })
    ]);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = sig; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  showToast('✓ Signature copiée — collez-la dans Gmail ou Outlook');
}

async function copyHTML() {
  const sig = buildSig().replace(/\n\s+/g,' ').replace(/\s+/g,' ').trim();
  try { await navigator.clipboard.writeText(sig); } catch { }
  showToast('✓ Code HTML copié');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

  document.getElementById('f-prenom').value = 'Marie';
  document.getElementById('f-nom').value = 'Dupont';
  document.getElementById('f-poste').value = 'Responsable de Site';
  document.getElementById('f-company').value = 'Deskeo';
  document.getElementById('f-email').value = 'm.dupont@deskeo.fr';
  document.getElementById('f-tel').value = '+33 1 23 45 67 89';
  document.getElementById('f-mobile').value = '';
  document.getElementById('f-website').value = 'www.deskeo.fr';
  document.getElementById('f-adresse').value = '35 rue du Sentier, 75002 Paris';
  document.getElementById('c-primary').value = '#0F1B35';
  document.getElementById('c-accent').value = '#C8A84B';
  currentTpl = 0;
  render();
}

// ── INIT ─────────────────────────────────────────────────────────
renderSocialToggles();
renderTemplateSidebar();
render();

// Live update template sidebar on any input
document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('input', () => { renderTemplateSidebar(); });
  el.addEventListener('change', () => { renderTemplateSidebar(); });
});
</script>
